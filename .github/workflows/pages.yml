name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test routing and public UI
        run: npm test
        working-directory: pages-api
      - name: Inspect live Cloudflare API (no AI inference)
        run: |
          node --input-type=module <<'NODE'
          const expected = '20261019-81';
          const url = 'https://kokkai-ministry-router.haru620328.workers.dev/api/status';
          try {
            const response = await fetch(url, {
              signal: AbortSignal.timeout(15000),
              headers: { 'Cache-Control': 'no-cache' },
            });
            if (!response.ok) throw new Error('HTTP ' + response.status);
            const status = await response.json();
            const actual = typeof status.routing_version === 'string' ? status.routing_version : 'missing';
            console.log('LIVE_API_STATUS ' + JSON.stringify({
              expected, actual, matching: actual === expected,
              model_ready: status.model_ready === true,
              can_analyze: status.can_analyze === true,
              quota_exhausted: status.assessment_error === 'quota_exhausted'
            }));
            if (actual !== expected) console.log('API_REDEPLOY_REQUIRED: GitHub Pages does not deploy the separate Cloudflare Worker.');
          } catch (error) {
            console.log('LIVE_API_STATUS_UNAVAILABLE ' + String(error?.message || error).slice(0, 160));
          }
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
